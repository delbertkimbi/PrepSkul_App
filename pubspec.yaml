name: prepskul
description: "PrepSkul - Connect with verified tutors for personalized learning. Book trial sessions, schedule lessons, and track your progress."
publish_to: 'none' 
version: 1.0.0+14

environment:
  sdk: ^3.8.1


dependencies:
  fl_chart: ^0.68.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.1
  
  # Localization
  flutter_localizations:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.5.0
  
  # Google Sign-In
  google_sign_in: ^6.2.1
  
  # Firebase - upgraded for compatibility with GoogleUtilities 8.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.2.10
  
  # Local Notifications (for displaying notifications)
  flutter_local_notifications: ^16.3.0
  flutter_timezone: ^4.1.0
  
  # UI Components
  google_fonts: ^6.1.0
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  # Calendar and Scheduling
  table_calendar: ^3.0.9
  
  # Maps and Location
  geolocator: ^11.0.0
  geocoding: ^2.1.1  # For address to coordinates conversion
  flutter_map: ^6.1.0  # Leaflet for Flutter (open-source, privacy-friendly)
  latlong2: ^0.9.0  # Coordinates for flutter_map
  
  # Video Conferencing
  url_launcher: ^6.2.5
  youtube_player_flutter: ^9.0.3
  agora_rtc_engine: ^6.3.0  # Agora RTC SDK for live video sessions
  pointer_interceptor: ^0.10.1+2  # Keeps call chrome above web platform views

  # Local Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  
  # File Handling
  image_picker: ^1.0.7
  file_picker: ^8.0.0  # Updated for Flutter 3.35.6 compatibility
  path: ^1.8.3
  mime: ^2.0.0
  image: ^4.3.0  # For image compression and optimization
  
  # Utilities
  connectivity_plus: ^5.0.2
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  
  # HTTP Client
  http: ^1.1.0
  percent_indicator: ^4.2.3
  
  # Audio/Sound Effects
  audioplayers: ^6.0.0
  record: ^5.2.1
  # On-device speech recognition for say-it-back practice. Chosen over a cloud
  # STT so a child's voice never leaves the phone and the feature still works
  # during an internet shutdown.
  speech_to_text: ^7.4.0
  flutter_tts: ^4.0.2  
  # Sharing
  share_plus: ^10.0.0
  
  # Deep Linking
  app_links: ^6.3.3
  
  # Environment Variables
  flutter_dotenv: ^5.1.0
  
  # Google APIs (for Calendar)
  googleapis: ^11.0.0
  googleapis_auth: ^1.4.1
  
  # Confetti Celebration
  confetti: ^0.7.0
  
  # Platform Achievements & Leaderboards
  games_services: ^5.0.0
  video_player: ^2.10.1
  pdf: ^3.12.0
  pdfx: ^2.9.2
  country_flags: ^4.1.2
  genui: ^0.9.2
  json_schema_builder: ^0.1.5
  phosphoricons_flutter: ^1.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter

 
  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  shaders:
    # The paper ground. See assets/shaders/paper.frag for why this stopped
    # being a CustomPainter.
    - assets/shaders/paper.frag

  assets:
    # Baloo 2 and Nunito, bundled rather than fetched.
    #
    # google_fonts downloads a typeface from fonts.gstatic.com the first time a
    # style is used and caches it. That is fine for a website and wrong for
    # this app: SkulMate is built to run a whole session with the network off,
    # and a child opening it for the first time on a phone with no data was
    # getting Roboto — the one screen where letterforms are the lesson.
    #
    # google_fonts checks the asset bundle before the network, so dropping the
    # exact static instances here makes the first launch offline-correct with
    # no code change. The weights are the ones PrimarTheme actually asks for;
    # anything else resolves to the nearest bundled one.
    - assets/fonts/google/
    - lib/data/
    - assets/images/
    - assets/data/
    - assets/audio/
    - assets/audio/sfx/
    - assets/audio/music/bgm_focus_loop.ogg
    - assets/audio/music/bgm_adventure_loop.ogg
    - assets/audio/music/bgm_results_soft_loop.ogg
    - assets/audio/music/sfx_card_flip.ogg
    - assets/audio/music/sfx_correct_chime.ogg
    - assets/audio/music/sfx_level_up.ogg
    - assets/audio/music/sfx_streak_ping.ogg
    - assets/audio/music/sfx_tap_soft.ogg
    - assets/audio/music/sfx_victory_short.ogg
    - assets/audio/music/sfx_wrong_mute.ogg
    - assets/sounds/
    - assets/characters/
    # Explicit paths so Android release builds reliably bundle mascot media (folder-only
    # entries have been observed to omit some subpaths on some toolchains).
    - assets/characters/mascots/default.png
    - assets/characters/mascots/thinking.png
    - assets/characters/mascots/encouraging.png
    - assets/characters/mascots/celebration.png
    # KYC flow mascots (explicit paths — subfolder assets under images/ can be omitted on some builds)
    - assets/images/kyc/kyc_intro.png
    - assets/images/kyc/kyc_submitted.png
    - assets/images/kyc/kyc_pending.png
    - assets/images/kyc/kyc_rejected.png
    - assets/characters/animations/Neutral.mp4
    - assets/characters/animations/Think.mp4
    - assets/characters/animations/Encouraging.mp4
    - assets/characters/animations/Celebrate.mp4
    # Small WebP choice illustrations keep onboarding quick on mobile data.
    - assets/onboard/art/tile-backpack.webp
    - assets/onboard/art/tile-book.webp
    - assets/onboard/art/tile-flask.webp
    - assets/onboard/art/tile-globe.webp
    - assets/onboard/art/tile-heart.webp
    - assets/onboard/art/tile-laptop.webp
    - assets/onboard/art/tile-leaf.webp
    - assets/onboard/art/tile-maths.webp
    - assets/onboard/art/tile-medal.webp
    - assets/onboard/art/tile-pencil.webp
    - assets/fonts/
    - .env  # Root .env file (bundled for web, used for all platforms)

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins/Poppins-Black.ttf
          weight: 900

l10n:
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart
  synthetic-package: true

dependency_overrides:
  record_platform_interface: 1.2.0
  record_web: 1.1.8
